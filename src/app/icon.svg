<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Yasmeen Hasan">
  <!-- The nav flower, redrawn for a favicon.

       Same construction as components/sections/Nav.tsx: five ellipses at 72
       degree intervals around a centre disc. The colours are the one thing
       that changes. On the page the petals are --petal (#F9C0D0) on a cream
       ground, which is correct there and invisible at 16 pixels on a white
       browser tab. These use --petal-deep (#A83E66) so the mark survives the
       size, with --apricot kept for the centre so it still reads as the same
       flower rather than a different one. -->
  <g fill="#A83E66">
    <ellipse cx="50" cy="28" rx="14" ry="22"/>
    <ellipse cx="50" cy="28" rx="14" ry="22" transform="rotate(72 50 50)"/>
    <ellipse cx="50" cy="28" rx="14" ry="22" transform="rotate(144 50 50)"/>
    <ellipse cx="50" cy="28" rx="14" ry="22" transform="rotate(216 50 50)"/>
    <ellipse cx="50" cy="28" rx="14" ry="22" transform="rotate(288 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="11" fill="#FFD2A6"/>
</svg>
